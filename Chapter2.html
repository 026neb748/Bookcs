    <h1>Number System and Boolean Logic</h1>

    <p>Number systems are used to represent numbers in computers.</p>
    <p>Common systems are Binary, Decimal, Octal and Hexadecimal.</p>

    <h2>Boolean Logic</h2>
    <p>Boolean logic works with two values: TRUE and FALSE.</p>
    <p>Basic operators are AND, OR and NOT.</p>
